name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build browser
        run: dotnet build BeautyBrowser.slnx -c Release

      - name: Build installer
        run: dotnet build installer/BeautyInstaller/BeautyInstaller.csproj -c Release
